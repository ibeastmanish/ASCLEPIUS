[package]
name = "hygiea-desktop"
version = "1.0.0"
description = "HYGIEA desktop build: the same app as the web build, with Earth messages signed and encrypted by Hermes OpenPGP"
authors = ["Team HYGIEA"]
license = "MIT"
edition = "2021"
# aura (Hermes) uses Rust edition 2024.
rust-version = "1.85"

[lib]
name = "hygiea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
zeroize = "1.9"
# Hermes, the team's earlier open-source project (MIT OR Apache-2.0).
# Expects the Hermes repo checked out next to this one:  git clone <hermes repo> ../hermes
# When the Hermes repo is public, switch to:
#   aura = { git = "https://github.com/ibeastmanish/hermes.git", rev = "<commit>" }
aura = { path = "../../hermes/aura" }
# Only used to print OpenPGP key fingerprints. The crypto backend feature comes from aura.
sequoia-openpgp = { version = "2.3.0", default-features = false }

# Argon2 and OpenPGP are slow without optimisation; keep debug builds and tests usable.
[profile.dev.package."*"]
opt-level = 2
