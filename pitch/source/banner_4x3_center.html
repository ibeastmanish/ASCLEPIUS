<!doctype html><html><head><meta charset="utf-8"><style>
/* 4:3 team-page banner. Space Apps shows the centre ~80% x 70% (zoomed + blurred),
   so every key element sits inside x 200-1400, y 240-960. */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:1200px;overflow:hidden;background:#000;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;position:relative}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.6px 1.6px at 120px 80px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 300px 400px,#cfe0ff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 700px 120px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 980px 520px,#fff 50%,transparent 51%),radial-gradient(1.7px 1.7px at 520px 300px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 860px 60px,#cfe0ff 50%,transparent 51%);background-size:900px 600px;opacity:.8}
.mars{position:absolute;left:50%;top:760px;width:2300px;height:2300px;margin-left:-1150px;border-radius:50%;object-fit:cover;filter:saturate(1.15)}
.glow{position:absolute;left:50%;top:700px;width:2500px;height:2500px;margin-left:-1250px;border-radius:50%;box-shadow:0 0 160px 40px rgba(252,90,40,.35)}
.fade{position:absolute;inset:0;background:radial-gradient(ellipse 58% 40% at 50% 42%,rgba(0,0,0,.9) 0%,rgba(0,0,0,.6) 60%,rgba(0,0,0,0) 100%)}
.orbit{position:absolute;left:50%;border-radius:50%;border:2px solid rgba(111,163,255,.35)}
.orbit.r{border-color:rgba(252,61,33,.55);border-style:dashed}
.earth{position:absolute;left:120px;top:96px;width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 40px rgba(111,163,255,.8)}
.c{position:absolute;left:0;right:0;top:300px;text-align:center}
.eye{font:700 22px/1 "Helvetica Neue",Arial;letter-spacing:.34em;color:#FC3D21;text-transform:uppercase}
h1{font-size:184px;font-weight:800;letter-spacing:.05em;line-height:.9;margin-top:30px;text-shadow:0 8px 40px rgba(0,0,0,.8)}
.bar{width:420px;height:8px;background:#FC3D21;margin:30px auto 0}
.tag{font-size:64px;font-weight:700;line-height:1.12;margin-top:30px;text-shadow:0 6px 30px rgba(0,0,0,.9)}
.chips{display:flex;justify-content:center;gap:18px;margin-top:44px}
.chip{display:inline-flex;align-items:center;gap:12px;font:800 28px/1 "Helvetica Neue",Arial;padding:16px 26px;border-radius:999px;background:rgba(10,10,12,.88);border:2px solid #3a3a40}
.dot{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#000;font-size:16px;font-weight:900}
.g{background:#2EC27E}.y{background:#FFC72C}.rd{background:#FC3D21}
.linklbl{position:absolute;left:206px;top:118px;font:700 18px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#cfe0ff}
.foot{position:absolute;left:0;right:0;bottom:48px;text-align:center;font:600 20px/1 "Helvetica Neue",Arial;letter-spacing:.16em;color:#c9cfdb;text-transform:uppercase;text-shadow:0 2px 12px #000}
</style></head><body>
<div class="glow"></div>
<img class="mars" src="img/mars_sq.jpg">
<div class="stars"></div>
<div class="orbit" style="top:-260px;width:1900px;height:1900px;margin-left:-950px"></div>
<div class="orbit r" style="top:-420px;width:2200px;height:2200px;margin-left:-1100px"></div>
<div class="fade"></div>
<img class="earth" src="img/bluemarble_sq.jpg">
<div class="linklbl">EARTH ⇢ MARS · UP TO 22 MIN</div>
<div class="c">
  <div class="eye">NASA Space Apps 2026 · Astronaut health</div>
  <h1>ASCLEPIUS</h1>
  <div class="bar"></div>
  <div class="tag">Medicine for when Earth<br>is too far away.</div>
  <div class="chips"><span class="chip"><span class="dot g">✓</span>Earth guides</span><span class="chip"><span class="dot y">→</span>Act, Earth confirms</span><span class="chip"><span class="dot rd">!</span>Crew decides</span></div>
</div>
<div class="foot">Tula Manish · Warangal, India · Images: NASA/JPL/USGS, NASA</div>
</body></html>
